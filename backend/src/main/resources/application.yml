server:
  port: 8080

spring:
  application:
    name: quiz-module

  datasource:
    url: jdbc:postgresql://localhost:5432/quiz_lms
    username: quiz_user
    password: quiz_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    org.hibernate.SQL: debug